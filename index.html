<style>
:root {
  --bg: #f6f4ef; --card: #ffffff; --text: #1e2126; --muted: #6b7280;
  --border: #e5e1d8; --accent: #0f6f5c; --accent-text: #ffffff;
  --pill-hi: #dcefe4; --pill-hi-t: #14532d; --pill-mid: #fdf0d5; --pill-mid-t: #92400e;
  --pill-lo: #fde2e2; --pill-lo-t: #991b1b; --pill-na: #ececec; --pill-na-t: #6b7280;
  --chip: #eef2f7; --chip-t: #374151; --danger: #b91c1c;
  --st-applied: #dbeafe; --st-applied-t: #1d4ed8;
  --st-interviewing: #ede9fe; --st-interviewing-t: #6d28d9;
  --st-offer: #dcfce7; --st-offer-t: #15803d;
  --st-rejected: #f3f4f6; --st-rejected-t: #6b7280;
  --st-skipped: #fdeee0; --st-skipped-t: #9a3412;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14161a; --card: #1e2127; --text: #e8e6e1; --muted: #9aa1ab;
    --border: #2c3038; --accent: #2fbf9b; --accent-text: #0b0d10;
    --pill-hi: #143526; --pill-hi-t: #7fd8a8; --pill-mid: #3a2c12; --pill-mid-t: #f0b862;
    --pill-lo: #3a1a1a; --pill-lo-t: #f08a8a; --pill-na: #2a2d33; --pill-na-t: #9aa1ab;
    --chip: #262a31; --chip-t: #c3c9d1; --danger: #f08a8a;
    --st-applied: #172a54; --st-applied-t: #8ab4ff;
    --st-interviewing: #2a1f4d; --st-interviewing-t: #c4b5fd;
    --st-offer: #14351f; --st-offer-t: #86efac;
    --st-rejected: #26292e; --st-rejected-t: #9aa1ab;
    --st-skipped: #3a2416; --st-skipped-t: #f0a875;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 15px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif; }
header { padding: 22px 24px 8px; max-width: 1280px; margin: 0 auto; }
h1 { margin: 0 0 2px; font-size: 24px; display: flex; align-items: center; gap: 10px; }
h1 svg { width: 30px; height: 30px; flex: none; }
.sub { color: var(--muted); font-size: 13px; }
.pipeline { display: flex; flex-wrap: wrap; gap: 8px; max-width: 1280px;
  margin: 12px auto 0; padding: 0 24px; }
.stagechip { border: 1px solid var(--border); background: var(--card);
  border-radius: 999px; padding: 5px 14px; font-size: 13px; cursor: pointer; color: var(--text); }
.stagechip.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
.stagechip b { font-weight: 700; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  max-width: 1280px; margin: 12px auto 0; padding: 0 24px; }
.controls input[type=search], .controls select {
  background: var(--card); color: var(--text); border: 1px solid var(--border);
  border-radius: 10px; padding: 8px 10px; font-size: 13.5px; }
.controls input[type=search] { flex: 1 1 220px; min-width: 170px; }
.controls label { font-size: 13px; color: var(--muted); display: flex;
  align-items: center; gap: 5px; white-space: nowrap; }
#count { margin-left: auto; font-size: 13px; color: var(--muted); }
main { max-width: 1280px; margin: 16px auto 60px; padding: 0 24px;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 16px; }
.card { background: var(--card); border: 1px solid var(--border);
  border-radius: 14px; padding: 18px 18px 14px; display: flex;
  flex-direction: column; gap: 8px; }
.card.dead { opacity: .6; }
.card h2 { margin: 0; font-size: 16.5px; line-height: 1.35; }
.company { font-weight: 600; font-size: 14px; }
.meta { color: var(--muted); font-size: 13px; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }
.pill, .chip { border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; }
.pill.hi  { background: var(--pill-hi);  color: var(--pill-hi-t); }
.pill.mid { background: var(--pill-mid); color: var(--pill-mid-t); }
.pill.lo  { background: var(--pill-lo);  color: var(--pill-lo-t); }
.pill.na  { background: var(--pill-na);  color: var(--pill-na-t); font-weight: 500; }
.chip { background: var(--chip); color: var(--chip-t); font-weight: 500; }
.chip.warn { color: var(--danger); font-weight: 600; }
.statusbadge { border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 700; }
.st-applied      { background: var(--st-applied);      color: var(--st-applied-t); }
.st-interviewing { background: var(--st-interviewing); color: var(--st-interviewing-t); }
.st-offer        { background: var(--st-offer);        color: var(--st-offer-t); }
.st-rejected     { background: var(--st-rejected);     color: var(--st-rejected-t); }
.st-skipped      { background: var(--st-skipped);      color: var(--st-skipped-t); }
.reason { font-size: 13px; color: var(--muted); font-style: italic;
  border-left: 3px solid var(--border); padding-left: 10px; margin: 2px 0; white-space: pre-line; }
.desc { font-size: 13.5px; color: var(--muted); overflow: hidden;
  display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; }
.desc.open { display: block; -webkit-line-clamp: unset; }
.more { background: none; border: none; color: var(--accent); cursor: pointer;
  font-size: 13px; padding: 0; text-align: left; width: fit-content; }
.foot { margin-top: auto; display: flex; align-items: center; gap: 10px; padding-top: 6px; }
.apply { background: var(--accent); color: var(--accent-text); text-decoration: none;
  font-weight: 600; font-size: 14px; border-radius: 10px; padding: 8px 18px; }
.apply:hover { filter: brightness(1.08); }
.salary { font-size: 13px; font-weight: 600; }
.track { display: flex; flex-wrap: wrap; gap: 6px; border-top: 1px dashed var(--border);
  padding-top: 10px; margin-top: 2px; }
.track button { background: var(--chip); color: var(--chip-t); border: 1px solid var(--border);
  border-radius: 8px; padding: 4px 10px; font-size: 12px; cursor: pointer; }
.track button:hover { border-color: var(--accent); }
.track button.on-applied      { background: var(--st-applied);      color: var(--st-applied-t);      font-weight: 700; }
.track button.on-interviewing { background: var(--st-interviewing); color: var(--st-interviewing-t); font-weight: 700; }
.track button.on-offer        { background: var(--st-offer);        color: var(--st-offer-t);        font-weight: 700; }
.track button.on-rejected     { background: var(--st-rejected);     color: var(--st-rejected-t);     font-weight: 700; }
.track button.on-skipped      { background: var(--st-skipped);      color: var(--st-skipped-t);      font-weight: 700; }
.empty { grid-column: 1 / -1; text-align: center; color: var(--muted); padding: 60px 0; }
#toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: var(--text); color: var(--bg); border-radius: 10px; padding: 10px 18px;
  font-size: 13.5px; opacity: 0; transition: opacity .3s; pointer-events: none; max-width: 90vw; }
#toast.show { opacity: .95; }
</style>
</head>

<script>
const JOBS = [{"id": "6bfeee98afba7266", "title": "Senior QA Engineer — Quality Engineering & Automation", "company": "Aspire", "location": "Gurugram, Haryana", "salary": null, "url": "https://in.linkedin.com/jobs/view/senior-qa-engineer-%E2%80%94-quality-engineering-automation-at-aspire-4434865588", "posted_date": "2026-07-08", "source": "jsearch", "experience_hint": "3+ years", "description": "About The Company Founders today are building global companies from day one — but the systems that manage their money were built for a different era. Aspire exists to change that! We’re building the financial operating system for global founders, bringing banking, software, and automation into a single platform so businesses can move faster across borders and stay focused on building. Aspire is built by people who think from first principles, care deeply about solving hard problems, and take real ownership of their work. Our team brings global experience from leading fintech and technology companies, and many of us are former founders and operators who understand what it takes to build thoughtfully, make trade-offs, and deliver at scale in a global environment. Backed by leading global investors including Y Combinator, Peak XV, and Lightspeed, Aspire has been trusted by more than 50,000 startups and growing businesses worldwide to manage their finances since 2018. Together with partners like J.P. Morgan, Visa, and Wise, we’re building for the next generation of global companies. About The Role AI is redefining what quality engineering can do. The best engineering teams have already moved on from manual test cases and long regression cycles. Tests are generated by agents. Coverage gaps are caught before code merges. Quality is enforced by the system — not by a human at the end of the pipeline. Aspire is building that future now. We have a merge guardrail in production that rea", "fit_score": null, "response_score": null, "blended_score": null, "reasoning": null, "via": "LinkedIn", "flagged": false, "link_dead": false, "app_status": null, "city": "Gurgaon", "work_mode": "onsite"}, {"id": "d7f3e67c0ad3e5df", "title": "Software Development Engineer in Test (SDET I)", "company": "Enpass", "location": "Gurugram, Haryana", "salary": null, "url": "https://in.linkedin.com/jobs/view/software-development-engineer-in-test-sdet-i-at-enpass-4437363553", "posted_date": "2026-07-09", "source": "jsearch", "experience_hint": "1–2 years", "description": "We're Hiring! Software Development Engineer in Test (SDET I) Location: Gurgaon /Remote Job Summary As an SDET I at Enpass, you will play a key role in ensuring the quality and reliability of our applications across multiple platforms, including desktop, mobile, web applications, and browser extensions. You will collaborate closely with the Development, Product, and QE teams to design, automate, and execute test scenarios, helping deliver high-quality software to our users. Key Responsibilities • Develop, maintain, and enhance automation test scripts for functional, regression, and integration testing across Windows, macOS, iOS, Android, Web applications, and browser extensions. • Collaborate with developers and product teams to understand requirements and identify test scenarios suitable for automation. • Work with the Cucumber framework for Behavior-Driven Development (BDD). • Design, execute, and maintain automated test cases to validate application functionality, performance, and security. • Document test cases, execution results, and defects using TestRail. • Support CI/CD pipelines by integrating and maintaining automated test execution. • Log, track, and verify defects using JIRA or similar issue-tracking tools. • Analyze test execution results, identify defects, and work with development teams to ensure timely resolution. • Participate in code reviews and contribute to improving automation frameworks and testing processes. • Explore and evaluate AI-powered testing tool", "fit_score": null, "response_score": null, "blended_score": null, "reasoning": null, "via": "LinkedIn", "flagged": false, "link_dead": false, "app_status": null, "city": "Gurgaon", "work_mode": "onsite"}, {"id": "16359d1be7718960", "title": "Senior QA Engineer - AI Native and Agentic Systems - Zenara Health", "company": "2070Health", "location": "Remote — India", "salary": null, "url": "https://jobs.workable.com/view/cexPsxoCye63X2gSaSGxhm/remote-senior-qa-engineer---ai-native-and-agentic-systems---zenara-health-in-india-at-2070health", "posted_date": "2026-07-10", "source": "workable", "experience_hint": "3+ years", "description": "**This is not a role with 2070 Health** Role Title: Senior QA Engineer — AI Native and Agentic Systems Location: Remote across India (works US Pacific hours) Type: Full-time About the Company: Zenara Health is a technology-driven mental health care company dedicated to transforming access and quality of mental wellness services. The company combines AI-powered platforms with expert clinical care to deliver personalized, effective mental health solutions. Zenara Health strives to innovate and improve mental health outcomes by connecting patients and providers through a seamless digital experience. About the role: This Is Not a Traditional QA Role This is not a transitional or maintenance QA position. We are building agentic software development, and we need QA that operates at the same speed, intelligence, and autonomy as development. You will design and own an AI-driven QA system that: • Tests complex SaaS products end-to-end • Discovers bugs autonomously (without hand-written test cases) • Simulates how a new human QA engineer would deeply explore the product • Runs continuously (ideally 24× 7) • Integrates directly into agentic development loops If your idea of QA is mostly writing Selenium scripts from requirements, this role is not for you. The Mission Build and operate an autonomous QA engine that: • Thinks like a human QA engineer • Acts like an AI system • Never sleeps • And never lets defects escape QA here is not a gate at the end — it is a real-time adversary to dev", "fit_score": null, "response_score": null, "blended_score": null, "reasoning": null, "via": null, "flagged": false, "link_dead": false, "app_status": null, "city": "Remote", "work_mode": "remote"}, {"id": "89091d5f16dda315", "title": "SDET - 1", "company": "LambdaTest is now TestMu AI", "location": "Noida, Uttar Pradesh", "salary": null, "url": "https://in.linkedin.com/jobs/view/sdet-1-at-lambdatest-is-now-testmu-ai-4436951408", "posted_date": "2026-07-04", "source": "jsearch", "experience_hint": null, "description": "As an SDET-1 you aren't a \"script maintainer. You are anAI-first Quality Architect. You will be responsible for bridging the gap between legacy automation and the future of autonomous agentic workflows. If you want to move from \"writing code that tests\" to \"building AI that tests, \" this is your seat. The Candidate Will Have Responsibilities Across The Following Functions Agentic Framework Engineering (50%): • Architectural Excellence: Build and scale deep-level frameworks (Playwright, Selenium, Appium) designed specifically for AI-driven execution. • AI Augmentation: Integrate LLMs and Agentic tools into the SDLC to automate test generation and reduce human intervention by > 50%. • Performance Coding: Leverage strong DSA foundations to write highly optimised, non-blocking test code that scales with our platform. Autonomous CI/CD and Reliability (30%): • Pipeline Orchestration: Design seamless \"no-touch\" integration into CI/CD (GitHub Actions / Jenkins) where tests trigger and analyse results autonomously. • Root Cause Mastery: Use deep-dive debugging to eliminate flakiness, ensuring our AI agents operate in a stable environment. • Full-Stack Ownership: Move beyond checklists; you own the E2E quality of your ticket/module from creation to deployment. Tech Depth and Tooling (20%): • Polyglot Mastery: Solve complex technical challenges across Java, Python, or TypeScript. • Cloud Infrastructure: Validate data flows across AWS/GCP, Dockerized containers, and complex DB architectu", "fit_score": null, "response_score": null, "blended_score": null, "reasoning": null, "via": "LinkedIn", "flagged": false, "link_dead": false, "app_status": null, "city": "Noida", "work_mode": "onsite"}, {"id": "b547fd35c4ac07dd", "title": "Quality Analyst", "company": "highradius", "location": "Hyderabad, Telangana, India", "salary": null, "url": "https://www.highradius.com/about/careers-list/?gh_jid=7564207003", "posted_date": "2026-07-14", "source": "greenhouse", "experience_hint": "2–3 years", "description": "About Us HighRadius, a renowned provider of cloud-based Autonomous Software for the Office of the CFO, has transformed critical financial processes for over 800+ leading companies worldwide. Trusted by prestigious organizations like 3M, Unilever, Anheuser-Busch InBev, Sanofi, Kellogg Company, Danone, Hershey's, and many others, HighRadius optimizes order-to-cash, treasury, and record-to-report processes, earning us back-to-back recognition in Gartner's Magic Quadrant and a prestigious spot in Forbes Cloud 100 List for three consecutive years. With a remarkable valuation of $3.1B and an impressive annual recurring revenue exceeding $100M, we experience a robust year-over-year growth of 24%. With a global presence spanning 8+ locations and a recent addition in Poland, we're in the pre-IPO stage, poised for rapid growth. We invite passionate and diverse individuals to join us on this exciting path to becoming a publicly traded company and shape our promising future. Job Summary: We’re seeking a Quality Analyst (2–3 years exp.) to design and execute test strategies for scalable web applications and APIs. You’ll collaborate with developers and product managers, validate functional and non-functional requirements, and drive automation coverage while ensuring high quality standards. Responsibilities: Design, execute, and maintain manual and automated test cases for web, API, and database layers. Perform API testing using Postman or automation frameworks (REST Assured). Maintain UI a", "fit_score": null, "response_score": null, "blended_score": null, "reasoning": null, "via": null, "flagged": false, "link_dead": false, "app_status": null, "city": "Hyderabad", "work_mode": "onsite"}, {"id": "13e1ec8b5ed99aca", "title": "SDET | Quality Platform and Developer Tooling", "company": "Composio", "location": "Bengaluru, Karnataka", "salary": null, "url": "https://www.munotes.in/dailytechjobs?job=job-1785857508-composio-sdet-quality-platform-and-developer-tooling", "posted_date": "2026-08-04", "source": "jsearch", "experience_hint": null, "description": "Composio builds tooling that connects AI agents to real applications, and this SDET seat is about building the quality platform rather than executing tests. The posting asks you to build automation frameworks, quality platforms and developer tooling that other engineers rely on, and to apply the right quality strategy across API, integration, contract and end to end layers. The systems reasoning it expects is specific and grown up: API behaviour, authentication, retries, idempotency, eventual consistency and distributed systems, plus using logs, traces, metrics and production signals to investigate failures. It is also explicitly AI native, expecting you to use AI to accelerate testing and debugging. Apply if you care about release confidence and flaky test reduction rather than test counts. Who it is for: ⚠️ This posting states no years of experience anywhere. Composio's postings are known for this: an earlier one headed its list \"Must haves\" and then said \"if you are very good, nothing is a must per-se\". The experience figure is left empty rather than guessed, so this row appears in no experience band on the page filter. Judge it on the requirements, which are written as capabilities rather than years. Must haves, as the posting frames them. Automation and quality engineering: you build automation frameworks, quality platforms and developer tooling that engineers rely on. You write clean, maintainable automation and validation code and know how to apply the right quality st", "fit_score": null, "response_score": null, "blended_score": null, "reasoning": null, "via": "Munotes", "flagged": false, "link_dead": false, "app_status": null, "city": "Bangalore", "work_mode": "onsite"}, {"id": "c0147223653dcca7", "title": "Associate QA Automation Engineer", "company": "MCKESSON", "location": "Bengaluru, Karnataka", "salary": null, "url": "https://careers.mckesson.com/en/job/bengaluru/associate-qa-automation-engineer/733/96021640736", "posted_date": "2026-07-29", "source": "jsearch", "experience_hint": "2+ years", "description": "About McKesson Compile Established in 1833, McKesson is a US Fortune 10 global leader in healthcare supply chain management solutions, retail pharmacy, healthcare technology, community oncology, and specialty care. We partner with life sciences companies, manufacturers, providers, pharmacies, governments, and other healthcare organizations to help provide the right medicines, medical products, and healthcare services to the right patients at the right time, safely and cost effectively. Based in Bangalore India, McKesson Compile’s data is a comprehensive, full linked system of record for the US Healthcare market, with intelligence on 2M+ healthcare professionals (HCPs) and over 800K facilities. Compile’s data includes high capture medical and pharmacy claims, closed capture Medicare claims (100%), along with best-in-class provider affiliations and customer master. At McKesson we deliver careers with purpose and potential. Our focus on better health starts with creating an inclusive environment with strong values where you can build a fulfilling career. You can count on us to provide you with resources and opportunities to grow and be your best, while contributing to our pursui const PUBLIC = true;  // read-only snapshot: no tracker UI
// Served by the board server (locally or via Tailscale): talk same-origin.
// Opened as a plain file: fall back to the local server port.
const SERVER = location.protocol === 'file:' ? 'http://localhost:8765' : '';
const STATUSES = ['applied', 'interviewing', 'offer', 'rejected', 'skipped'];
const grid = document.getElementById('grid'), q = document.getElementById('q'),
      srcSel = document.getElementById('src'), sortSel = document.getElementById('sort'),
      citySel = document.getElementById('city'), modeSel = document.getElementById('mode'),
      whenSel = document.getElementById('when'), minSel = document.getElementById('minscore'),
      hasSalary = document.getElementById('hassalary'), hideFlag = document.getElementById('hideflag'),
      count = document.getElementById('count'), pipeline = document.getElementById('pipeline'),
      toast = document.getElementById('toast');
let stageFilter = 'active';

[...new Set(JOBS.map(j => j.source))].sort().forEach(s => {
  const o = document.createElement('option'); o.value = s; o.textContent = s; srcSel.appendChild(o);
});
[...new Set(JOBS.map(j => j.city))].sort().forEach(c => {
  const o = document.createElement('option'); o.value = c; o.textContent = c; citySel.appendChild(o);
});

function showToast(msg) {
  toast.textContent = msg; toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3200);
}

async function setStatus(job, status) {
  const newStatus = job.app_status === status ? null : status;
  try {
    const resp = await fetch(SERVER + '/track', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({id: job.id, status: newStatus}),
    });
    if (!resp.ok) throw new Error('HTTP ' + resp.status);
    job.app_status = newStatus;
    render();
    showToast(newStatus ? `Marked ${newStatus}: ${job.company}` : `Back to active: ${job.company}`);
  } catch (e) {
    showToast('⚠ Board server not running — start it with: python main.py serve');
  }
}

function pillClass(v) { return v == null ? 'na' : v >= 70 ? 'hi' : v >= 45 ? 'mid' : 'lo'; }

function daysAgo(dateStr) {
  if (!dateStr) return 999;
  return Math.floor((Date.now() - new Date(dateStr + 'T00:00:00')) / 86400000);
}

function renderPipeline() {
  if (PUBLIC) { pipeline.style.display = 'none'; return; }
  const counts = {active: 0, applied: 0, interviewing: 0, offer: 0, rejected: 0, skipped: 0};
  JOBS.forEach(j => counts[j.app_status || 'active']++);
  pipeline.replaceChildren(...['active', ...STATUSES, 'all'].map(st => {
    const b = document.createElement('button');
    b.className = 'stagechip' + (stageFilter === st ? ' active' : '');
    const label = st[0].toUpperCase() + st.slice(1);
    b.innerHTML = st === 'all' ? '<b>All</b>' : `${label} <b>${counts[st]}</b>`;
    b.onclick = () => { stageFilter = st; render(); };
    return b;
  }));
}

function card(j) {
  const c = document.createElement('article'); c.className = 'card' + (j.link_dead ? ' dead' : '');
  const h = document.createElement('h2'); h.textContent = j.title; c.appendChild(h);
  const comp = document.createElement('div'); comp.className = 'company';
  comp.textContent = j.company; c.appendChild(comp);
  const meta = document.createElement('div'); meta.className = 'meta';
  meta.textContent = [j.location, j.work_mode, j.posted_date ? 'posted ' + j.posted_date : '',
                      j.experience_hint ? 'exp: ' + j.experience_hint : ''].filter(Boolean).join(' · ');
  c.appendChild(meta);
  const pills = document.createElement('div'); pills.className = 'pills';
  if (j.app_status) {
    const s = document.createElement('span'); s.className = 'statusbadge st-' + j.app_status;
    s.textContent = j.app_status.toUpperCase(); pills.appendChild(s);
  }
  if (PUBLIC) {
    // no score pills on the public snapshot
  } else if (j.blended_score != null) {
    for (const [label, v] of [['match ' + j.blended_score, j.blended_score],
                              ['fit ' + j.fit_score, j.fit_score],
                              ['response ' + j.response_score, j.response_score]]) {
      const p = document.createElement('span'); p.className = 'pill ' + pillClass(v);
      p.textContent = label; pills.appendChild(p);
    }
  } else {
    const p = document.createElement('span'); p.className = 'pill na';
    p.textContent = 'not scored yet'; pills.appendChild(p);
  }
  const chip = document.createElement('span'); chip.className = 'chip';
  chip.textContent = j.via ? j.source + ' · ' + j.via : j.source; pills.appendChild(chip);
  if (j.link_dead) { const d = document.createElement('span'); d.className = 'chip warn';
    d.textContent = '✗ posting may be closed'; pills.appendChild(d); }
  if (j.flagged) { const f = document.createElement('span'); f.className = 'chip';
    f.textContent = '⚠ check location'; pills.appendChild(f); }
  c.appendChild(pills);
  if (j.reasoning) { const r = document.createElement('div'); r.className = 'reason';
    r.textContent = j.reasoning; c.appendChild(r); }
  if (j.description) {
    const d = document.createElement('div'); d.className = 'desc';
    d.textContent = j.description; c.appendChild(d);
    const m = document.createElement('button'); m.className = 'more'; m.textContent = 'Show more';
    m.onclick = () => { d.classList.toggle('open');
      m.textContent = d.classList.contains('open') ? 'Show less' : 'Show more'; };
    c.appendChild(m);
  }
  const foot = document.createElement('div'); foot.className = 'foot';
  const a = document.createElement('a'); a.className = 'apply'; a.href = j.url;
  a.target = '_blank'; a.rel = 'noopener'; a.textContent = 'Apply ↗'; foot.appendChild(a);
  if (j.salary) { const s = document.createElement('span'); s.className = 'salary';
    s.textContent = j.salary; foot.appendChild(s); }
  c.appendChild(foot);
  if (PUBLIC) return c;
  const track = document.createElement('div'); track.className = 'track';
  STATUSES.forEach(st => {
    const b = document.createElement('button');
    b.textContent = st === j.app_status ? '✓ ' + st : st;
    if (st === j.app_status) b.className = 'on-' + st;
    b.onclick = () => setStatus(j, st);
    track.appendChild(b);
  });
  c.appendChild(track);
  return c;
}

if (PUBLIC) {
  // scores are private: hide the min-match filter, reduce sort options
  minSel.style.display = 'none';
  sortSel.replaceChildren(...[['rank', 'Ranked (best first)'], ['date', 'Newest first']]
    .map(([v, t]) => { const o = document.createElement('option'); o.value = v; o.textContent = t; return o; }));
}

function render() {
  renderPipeline();
  const term = q.value.trim().toLowerCase(), src = srcSel.value, sort = sortSel.value;
  let rows = JOBS.filter(j =>
    (stageFilter === 'all' || (j.app_status || 'active') === stageFilter) &&
    (!src || j.source === src) &&
    (!citySel.value || j.city === citySel.value) &&
    (!modeSel.value || j.work_mode === modeSel.value) &&
    (!whenSel.value || daysAgo(j.posted_date) < parseInt(whenSel.value)) &&
    (!minSel.value || (j.blended_score ?? -1) >= parseInt(minSel.value)) &&
    (!hasSalary.checked || j.salary) &&
    (!hideFlag.checked || !j.flagged) &&
    (!term || (j.title + ' ' + j.company + ' ' + (j.description || '') + ' ' + (j.location || ''))
      .toLowerCase().includes(term)));
  const key = {score: 'blended_score', fit: 'fit_score', response: 'response_score'}[sort];
  if (sort === 'date') {
    rows.sort((a, b) => (b.posted_date || '').localeCompare(a.posted_date || ''));
  } else if (key) {
    rows.sort((a, b) => (b[key] ?? -1) - (a[key] ?? -1) ||
                        (b.posted_date || '').localeCompare(a.posted_date || ''));
  } // sort === 'rank' (public): keep server order — already best-first
  grid.replaceChildren(...rows.map(card));
  if (!rows.length) { const e = document.createElement('div'); e.className = 'empty';
    e.textContent = 'No jobs match these filters.'; grid.appendChild(e); }
  count.textContent = rows.length + ' of ' + JOBS.length + ' jobs';
}
[q, srcSel, sortSel, citySel, modeSel, whenSel, minSel, hasSalary, hideFlag]
  .forEach(el => el.addEventListener('input', render));
render();
</script>
